[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-job-matcher"
version = "0.1.0"
description = "Two-agent Telegram Python vacancy matching with LangGraph, Ollama, Qdrant and MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain-ollama>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "qdrant-client>=1.12,<2",
  "mcp>=2.3,<3",
  "mcp-server-fetch==2026.10.19",
  "telethon>=1.36,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
job-matcher-resume = "scripts.ingest_resume:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
